name: Build and verify

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust formatting patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Format and save patch
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch
          git diff --exit-code
      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fesilent-mouse-formatting
          path: formatting.patch
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Enable MSVC and Windows SDK tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64-msvc
      - name: Build and package Windows application
        shell: pwsh
        run: ./scripts/build-windows.ps1
      # 先上传编译产物，后跑完整验证，便于及时下载到真机检查 UI。
      - name: Upload Windows executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: fesilent-mouse-Windows-x64
          path: |
            dist/windows-x64/fesilent-mouse.exe
            dist/windows-x64/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Test workspace
        run: cargo test --workspace --target x86_64-pc-windows-msvc --locked
      - name: Check Clippy warnings
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

  macos:
    name: macOS Apple Silicon
    # GitHub 的 macos-15 标准镜像为 M1 arm64；运行时再校验，防止错发架构。
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-arm64
      - name: Build macOS app bundle
        run: bash scripts/build-macos-app.sh
      - name: Package macOS application
        run: |
          file dist/fesilent-mouse.app/Contents/MacOS/fesilent-mouse
          lipo dist/fesilent-mouse.app/Contents/MacOS/fesilent-mouse -verify_arch arm64
          codesign --verify --deep --strict dist/fesilent-mouse.app
          ditto -c -k --sequesterRsrc --keepParent dist/fesilent-mouse.app dist/fesilent-mouse-macOS-arm64.zip
          cd dist
          shasum -a 256 fesilent-mouse-macOS-arm64.zip > SHA256SUMS
      - name: Upload macOS app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: fesilent-mouse-macOS-arm64
          path: |
            dist/fesilent-mouse-macOS-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
