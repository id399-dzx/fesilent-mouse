[package]
name = "ms-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ms-platform.workspace = true
ms-core.workspace = true
tracing.workspace = true

# macOS 原生依赖只在目标平台引入
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

# 本 crate 允许 unsafe（FFI 边界），但每处必须有 // SAFETY: 注释（SPEC.md §7）
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
